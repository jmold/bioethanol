name: V0.20 validation

on:
  push:
    branches:
      - v0.20-connected-engine
      - v0.20.1-sheet-alignment
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: pip install -r requirements.txt fastapi uvicorn

      - name: Run Python regression suite
        run: python -m unittest discover -v

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
