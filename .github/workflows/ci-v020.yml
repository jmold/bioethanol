name: V0.20 validation

on:
  push:
    branches:
      - v0.20-connected-engine
      - v0.20.1-sheet-alignment
      - v0.20.2-file-io
      - v0.21-distillation-fidelity
  pull_request:
    branches:
      - main

concurrency:
  group: v020-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: pip install -r requirements.txt fastapi uvicorn

      - name: Run Python regression suite
        run: python -m unittest discover -v

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  desktop-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare desktop resource fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/backend | Out-Null
          New-Item -ItemType File -Force desktop/backend/bioagri-backend.exe | Out-Null

      - name: Check Tauri desktop shell
        run: cargo check --manifest-path src-tauri/Cargo.toml
