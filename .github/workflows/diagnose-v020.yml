name: Diagnose V0.20 tests

on:
  push:
    branches:
      - v0.20-connected-engine
    paths:
      - .github/workflows/diagnose-v020.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.20-connected-engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt fastapi uvicorn
      - name: Capture test output
        shell: bash
        run: |
          set +e
          python -m unittest discover -v > V020_TEST_OUTPUT.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> V020_TEST_OUTPUT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V020_TEST_OUTPUT.txt
          git commit -m "Capture V0.20 test diagnostics" || true
          git push origin HEAD:v0.20-connected-engine
          exit 0
