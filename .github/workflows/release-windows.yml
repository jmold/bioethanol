name: Release Windows application

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - RELEASE_VERSION
    tags:
      - "app-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python build dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build bundled calculation engine
        run: |
          pyinstaller --clean --noconfirm bioagri-backend.spec
          New-Item -ItemType Directory -Force desktop/backend | Out-Null
          Copy-Item dist/bioagri-backend.exe desktop/backend/bioagri-backend.exe -Force

      - name: Smoke test bundled calculation engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $p = Start-Process -FilePath ".\dist\bioagri-backend.exe" -PassThru
          try {
            $ok = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) { throw "Bundled backend exited during startup with code $($p.ExitCode)" }
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:47831/api/health" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "Bundled backend failed health check" }
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Pre-cache NSIS bundle tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip"
          $out = "$env:RUNNER_TEMP\nsis-3.11.zip"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
              if ((Get-Item $out).Length -gt 1000000) { break }
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          $cacheRoot = Join-Path $env:LOCALAPPDATA "tauri\NSIS"
          New-Item -ItemType Directory -Force $cacheRoot | Out-Null
          Expand-Archive -Path $out -DestinationPath $cacheRoot -Force

      - name: Build and publish signed Windows release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: "BioAgri Process Simulator v__VERSION__"
          releaseBody: "BioAgri Process Simulator V0.23 introduces Digital Twin 2.0 with individual live batch vessels, batch lineage, transfer and pump state, Scheduler 2.0 with a per-vessel Gantt, and a new plant KPI dashboard. It also hardens Windows packaging against transient NSIS download failures. Existing installations will be offered this signed update automatically."
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
